# Reuse photon_pipeline output: --prepared-dir OUTPUT/photon_qcd/data
# --training-dir OUTPUT/photon_qcd/train_results --correction-lib OUTPUT/EffectiveArea/corrections_all.json
# Also pass --inputdir PHOTON_PARQUET and a separate --outputdir.
base_config: photon.yaml
regions: [Barrel, Endcap]
preparation:
  max_rows_per_sample: 2000000
  batch_size: 100000
datasets:
  GJet:
    label: GJet photons (status 1)
    path: '{prepared_dir}/{region}/valid/signal.parquet'
    requirement: (status == 1) & (pt > 15) & ((abs(eta) < 1.4442) | ((abs(eta) > 1.5666) & (abs(eta) < 2.5)))
  QCD:
    label: QCD photon candidates (status 0,3)
    path: '{prepared_dir}/{region}/valid/background.parquet'
    requirement: ((status == 0) | (status == 3)) & (pt > 15) & ((abs(eta) < 1.4442) | ((abs(eta) > 1.5666) & (abs(eta) < 2.5)))
  TT:
    label: TT photon candidates (status 0,3)
    samples: [TT]
    requirement: ((status == 0) | (status == 3)) & (pt > 15) & ((abs(eta) < 1.4442) | ((abs(eta) > 1.5666) & (abs(eta) < 2.5)))
comparisons:
  GJet:
    signal: GJet
    backgrounds: [TT, QCD]
    label: 'ScoutingPhoton; GJet status 1; TT/QCD status 0,3; unit weights; no stitching'
wp_sources:
  PhotonIso:
    path: '{training_dir}/{region}/CutBased_WPs_PhotonIso_TMVA_seq.json'
    isolation_denominator: none
    labels: {WP70: Tight (70%), WP80: Medium (80%), WP90: Loose (90%)}
validation:
  unit_weights: true
  connect_sources: [PhotonIso]
  dedicated_wps: true
  allow_empty_slices: true
  input_columns: [sample, status, pt, eta, ScoutingRho.fixedGridRhoFastjetAll, sigmaIetaIeta, hOverE_calibrated, ecalIso_calibrated, hcalIso_calibrated]
  pt_regions:
    pt15to100: [15, 100]
    pt100to300: [100, 300]
    pt300to800: [300, 800]
    pt800plus: [800, null]
  monitor_eff:
    pt:
      label: '$p_T$ [GeV]'
      xscale: log
      binning: [15, 20, 30, 50, 80, 100, 150, 200, 300, 500, 800, 1200, 2000, 5000, 10000]
    eta:
      label: '$\eta$'
      binning: [-2.5, 2.5, 25]
    ScoutingRho.fixedGridRhoFastjetAll:
      label: '$\rho$ [GeV]'
      binning: [0, 80, 16]
  variables: {}
plot_style:
  formats: [pdf, png]
  process_palettes:
    TT: ['#123B63', '#236C99', '#4E9FC1']
    QCD: ['#7F2704', '#D94801', '#F58D3C']
    GJet: ['#36450F', '#697E29', '#9CAF50']
  max_series_per_panel: 24
  rc_params:
    figure.figsize: [12, 9]
    font.size: 20
    legend.fontsize: 11
    savefig.dpi: 150
  legend:
    loc: upper center
    bbox_to_anchor: [0.5, -0.15]
    ncol: 3
    frameon: false
  cms_label:
    label: Preliminary
    data: false
    com: 13.6
    fontsize: 20
