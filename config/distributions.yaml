# Candidate-level production checks, with no truth selection, ID cut, or reweighting.
# Curves have unit area in the displayed range. QCD bin mixtures follow row counts,
# not cross sections; these plots must not be interpreted as physical yields.
file_pattern: merged.parquet
batch_size: 100000
requirement: "pt >= 10"
selection_label: '$p_T \geq 10$ GeV; all truth categories'
formats: [pdf, png]
yscales: [linear, log]

process:
  DY:
    label: DY
    samples: [DYToLL_M50]
    color: "#0072B2"
    linestyle: "-"
  TT:
    label: TT
    samples: [TT]
    color: "#D55E00"
    linestyle: "--"
  QCD:
    label: QCD (HT)
    samples:
      - QCD_HT_40to70
      - QCD_HT_70to100
      - QCD_HT_100to200
      - QCD_HT_200to400
      - QCD_HT_400to600
      - QCD_HT_600to800
      - QCD_HT_800to1000
      - QCD_HT_1000to1200
      - QCD_HT_1200to1500
      - QCD_HT_1500to2000
      - QCD_HT_2000
    color: "#8A8F29"
    linestyle: "-."
  QCD_EM:
    label: QCD EM
    samples:
      - QCD_EMEnriched_Pt_20to30
      - QCD_EMEnriched_Pt_30to50
      - QCD_EMEnriched_Pt_50to80
    color: "#CC79A7"
    linestyle: ":"
  Zprime:
    label: "$Z'$ (6 TeV)"
    samples: [ZprimeTo2E_M6000]
    color: "#A77900"
    linestyle: [0, [5, 1, 1, 1, 1, 1]]

region_definition:
  Inclusive:
    requirement: "abs(eta) < 2.5"
    label: 'Inclusive, $|\eta| < 2.5$'
  Barrel:
    requirement: "abs(eta) < 1.479"
    label: 'Barrel, $|\eta| < 1.479$'
  Endcap:
    requirement: "(abs(eta) >= 1.479) & (abs(eta) < 2.5)"
    label: 'Endcap, $1.479 \leq |\eta| < 2.5$'

# Match the active ID convention: isolation divided by E = pt*cosh(eta).
# These are raw observables, before effective-area or energy corrections.
define_variable:
  Esc: "pt*cosh(eta)"
  relecalIso: "ecalIso/Esc"
  relhcalIso: "hcalIso/Esc"
  reltrackIso: "trackIso/Esc"
  abs_dEtaIn: "abs(dEtaIn)"
  abs_dPhiIn: "abs(dPhiIn)"
  abs_ooEMOop: "abs(ooEMOop)"

# Three entries mean [minimum, maximum, number of bins], as in standard.yaml.
# Any other list length specifies explicit edges; all processes share the edges.
# Out-of-range and nonfinite values are counted in summary.json, not folded.
inspect_variable:
  pt:
    label: 'Electron $p_T$ [GeV]'
    binning: [10, 15, 20, 30, 50, 80, 120, 200, 300, 500, 700, 1000, 1500, 2000, 3000, 5000, 10000]
    xscale: log
  pt_low:
    expression: pt
    label: 'Electron $p_T$ [GeV]'
    binning: [10, 200, 76]
  eta:
    label: 'Electron $\eta$'
    binning: [-2.5, 2.5, 50]
  phi:
    label: 'Electron $\phi$ [rad]'
    binning: [-3.141592653589793, 3.141592653589793, 64]
  Esc:
    label: '$E = p_T\cosh(\eta)$ [GeV]'
    binning: [10, 20, 50, 100, 200, 500, 1000, 2000, 3000, 5000, 10000, 20000]
    xscale: log
  rawEnergy:
    label: 'Raw ECAL energy [GeV]'
    binning: [0, 10, 20, 50, 100, 200, 500, 1000, 2000, 3000, 5000, 10000, 20000]
  sigmaIetaIeta:
    label: '$\sigma_{i\eta i\eta}$'
    binning: [0, 0.06, 60]
  r9:
    label: '$R_9$'
    binning: [0, 1.2, 60]
  hOverE:
    label: '$H/E$'
    binning: [0, 0.5, 50]
  dEtaIn:
    label: '$\Delta\eta_{\mathrm{in}}$'
    binning: [-0.1, 0.1, 80]
  dPhiIn:
    label: '$\Delta\phi_{\mathrm{in}}$ [rad]'
    binning: [-0.2, 0.2, 80]
  abs_dEtaIn:
    label: '$|\Delta\eta_{\mathrm{in}}|$'
    binning: [0, 0.1, 50]
  abs_dPhiIn:
    label: '$|\Delta\phi_{\mathrm{in}}|$ [rad]'
    binning: [0, 0.2, 50]
  ooEMOop:
    label: '$1/E - 1/p$ [GeV$^{-1}$]'
    binning: [-0.2, 0.2, 80]
  abs_ooEMOop:
    label: '$|1/E - 1/p|$ [GeV$^{-1}$]'
    binning: [0, 0.2, 50]
  missingHits:
    label: Missing hits
    binning: [-0.5, 10.5, 11]
  ecalIso:
    label: 'ECAL isolation [GeV]'
    binning: [0, 50, 50]
  hcalIso:
    label: 'HCAL isolation [GeV]'
    binning: [0, 50, 50]
  trackIso:
    label: 'Track isolation [GeV]'
    binning: [0, 50, 50]
  relecalIso:
    label: 'ECAL isolation / $E$'
    binning: [0, 2, 80]
  relhcalIso:
    label: 'HCAL isolation / $E$'
    binning: [0, 2, 80]
  reltrackIso:
    label: 'Track isolation / $E$'
    binning: [0, 2, 80]
  bestTrack_chi2overndf:
    label: 'Best track $\chi^2$/ndf'
    binning: [0, 10, 50]
  bestTrack_d0:
    label: 'Best track $d_0$ [cm]'
    binning: [-0.2, 0.2, 80]
  bestTrack_dz:
    label: 'Best track $d_z$ [cm]'
    binning: [-1, 1, 80]
  trackfbrem:
    label: 'Track $f_{\mathrm{brem}}$'
    binning: [-1, 1, 80]
  rho:
    expression: '`ScoutingRho.fixedGridRhoFastjetAll`'
    label: '$\rho$ [GeV]'
    binning: [0, 80, 40]
  nPU:
    expression: '`Pileup.nPU`'
    label: 'Pileup interactions (candidate-weighted)'
    binning: [-0.5, 99.5, 50]
  status:
    label: 'Electron truth category'
    binning: [-0.5, 3.5, 4]
    tick_labels: {0: Unmatched, 1: Prompt, 2: "Direct tau", 3: "Other matched"}

plot_style:
  rc_params:
    figure.figsize: [11, 8]
    font.size: 18
    legend.fontsize: 11
    legend.title_fontsize: 12
    savefig.dpi: 150
  legend:
    loc: upper right
    frameon: false
    borderaxespad: 1.0
  cms_label:
    label: Preliminary
    data: false
    com: 13.6
    loc: 0
    fontsize: 20
