# This is a template: set the shared CMSSW area, EOS directory, proxy and full DAS names.
cmssw:
  # Existing compiled area in your home/shared filesystem, accessible from Condor workers.
  base: /afs/cern.ch/user/t/tihsu/Scouting_EGM_ID_pipeline/CMSSW_15_1_0_pre3
  release: CMSSW_15_1_0_pre3
  scram_arch: el9_amd64_gcc12
  cmsset_default: /cvmfs/cms.cern.ch/cmsset_default.sh
  pset: ../ntuplizer/nano_cfg.py
  # Reference recipe; you maintain and compile this code in the shared area.
  source_repository: https://github.com/CMS-Run3ScoutingTools/cmssw.git
  source_commit: 3bcde91ff6ce2e635c6672b5dfa3774a2a427986

production:
  eos_output: root://eosuser.cern.ch//eos/user/t/tihsu/dataset/scouting_id
  campaign: id_parquet_v1
  # parquet combines Nano production and ID conversion in one worker; nano keeps the two-step flow.
  output_format: parquet
  input_redirector: root://cms-xrd-global.cern.ch/
  files_per_job: 1
  max_events: -1
  stageout_attempts: 3
  id_workflow: ../workflow.yaml

conversion:
  # A self-contained shell wrapper sourcing your validated Coffea environment.
  # Copied to the worker; use absolute paths inside it. Never source cmsenv here.
  setup_script: ../env.sh
  python: python3
  workers: 2
  chunk_size: 15000

condor:
  proxy: ${X509_USER_PROXY}
  os: el9
  job_flavour: workday
  cpus: 2
  memory_mb: 4000
  disk_mb: 12000

physics:
  modifiers:
    - Configuration.Eras.Modifier_run3_scouting_nanoAOD_2024_cff:run3_scouting_nanoAOD_2024
  report_every: 1000
  best_track:
    # Preserve the Nano producer defaults. The PDF's separate analyzer used 5 GeV.
    TrackPtMin: [12.0, 12.0]
    TrackChi2OverNdofMax: [3.0, 2.0]
    RelativeEnergyDifferenceMax: [1.0, 1.0]
    DeltaPhiMax: [0.06, 0.06]

samples:
  DYToLL_M50:
    enabled: true
    # Winter25: scouting modules passed on two events; rerun the full local test before production.
    das: "/DYto2L-4Jets_Bin-MLL-50_TuneCP5_13p6TeV_madgraphMLM-pythia8/Run3Winter25MiniAOD-142X_mcRun3_2025_realistic_v9-v3/MINIAODSIM"
    is_mc: true
    das_instance: prod/global
    # Optional saved DAS LFNs, one /store/...root per line; bypasses the DAS query.
    # file_list: ../inputs/DYToLL_M50.txt

  # User-supplied Winter25 DAS names; validate each sample with a local smoke test.
  # Use inclusive TT only; the extension is excluded from this campaign.
  TT:
    enabled: true
    das: "/TT_TuneCP5_13p6TeV_powheg-pythia8/Run3Winter25MiniAOD-142X_mcRun3_2025_realistic_v7-v2/MINIAODSIM"
    is_mc: true
    das_instance: prod/global

  ZprimeTo2E_M6000:
    enabled: true
    das: "/ZprimeTo2E_Par-M-6000_TuneCP5_13p6TeV_pythia8/Run3Winter25MiniAOD-142X_mcRun3_2025_realistic_v7-v3/MINIAODSIM"
    is_mc: true
    das_instance: prod/global

  # Legacy unfiltered pT inputs are retained for provenance, disabled for resubmission.
  # HT and EM-enriched samples below are independent background studies.
  QCD_Pt_30to50:
