# Winter25 GJ photon study: use with postprocess.py and merged Parquet receipts.
# Both classes use the same 16 sources; status selects disjoint photon candidates.
# XSDB values are Summer24 LO references, not new Winter25 measurements.
# The corresponding Summer24 and Winter25 McM generator fragments match exactly.
# XSDB automatic records use GenXSecAnalyzer final cross sections; do not multiply
# the McM filter_efficiency or match_efficiency again.
# Reference: https://github.com/cms-sw/xsecdb/blob/2e1c4721dcb78edb423dbe833326c3220a127c47/scripts/xsec_calc_auto/3_convert_outputs.py
# Weight = Generator.weight * cross_section_pb / preselection sum_genweight.
# luminosity_pb=1 gives pb-equivalent weights. Each HT/PTG bin is its own group.
# provenance is audit metadata; das_events_reference is NOT a weight denominator.
# No candidate-row cap is allowed for physical normalization. Training retains the
# base photon pT/eta reweighting; held-out validation retains physical weights.
base_config: photon.yaml
steps:
- calibrate
- prepare
- train
- validate
default_wp: null
signal_requirement: (status == 1) & (pt > 15) & ((abs(eta) < 1.4442) | ((abs(eta) > 1.5666) & (abs(eta) < 2.5)))
background_requirement: ((status == 0) | (status == 3)) & (pt > 15) & ((abs(eta) < 1.4442) | ((abs(eta) > 1.5666) & (abs(eta)
  < 2.5)))
training_weight_mode: nonnegative
normalization:
  weight_column: Generator.weight
  luminosity_pb: 1.0
  groups:
    GJ_Winter25_HT_1000_PTG_100to200:
