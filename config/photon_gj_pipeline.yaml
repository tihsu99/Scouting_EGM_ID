# Standalone Winter25 GJ photon analysis: calibrate, prepare, train, validate.
# All analysis settings live here; no base_config or external YAML is loaded.
# prepare plots workflow.InspectDistribution.inspect_variable after corrections.
# shared controls both calibration and preparation, including the cached prefix cap.
# Prefix N/K rescaling assumes representative source ordering; event sums come from receipts.
# Isolation is absolute in GeV, with no division by E or pT.
# XSDB values are Summer24 LO references; matched McM generator fragments are recorded below.
# XSDB automatic values are final cross sections: do not multiply filtering efficiencies again.
# Reference: https://github.com/cms-sw/xsecdb/blob/2e1c4721dcb78edb423dbe833326c3220a127c47/scripts/xsec_calc_auto/3_convert_outputs.py
# das_events_reference is audit metadata, not the normalization denominator.
steps: [calibrate, prepare, train, validate]
default_wp: null
signal_requirement: (status == 1) & (pt > 10) & ((abs(eta) < 1.4442) | ((abs(eta) > 1.5666) & (abs(eta) < 2.5)))
background_requirement: ((status == 0) | (status == 3)) & (pt > 10) & ((abs(eta) < 1.4442) | ((abs(eta) > 1.5666)
  & (abs(eta) < 2.5)))
training_weight_mode: nonnegative
shared:
  n_files: -1
  n_workers: 1
  random_seed: 42
  train_ratio: 0.8
  split_columns: [sample, run, luminosityBlock, event]
  max_rows_per_sample: 2000000
  batch_size: 1000000
  region_definition:
    Barrel:
      requirement: abs(eta) < 1.4442
    Endcap:
      requirement: (abs(eta) > 1.5666) & (abs(eta) < 2.5)
  plot_style:
    formats: [pdf, png]
    max_series_per_panel: 24
    rc_params:
      figure.figsize: [12, 9]
      font.size: 20
      legend.fontsize: 11
      savefig.dpi: 150
    legend:
      loc: upper center
      bbox_to_anchor: [0.5, -0.15]
      ncol: 3
      frameon: false
    cms_label:
      label: Preliminary
      data: false
      com: 13.6
      fontsize: 20
  sampling:
    method: prefix
    cache_dir: outputs/cache/photon_gj_calibration
  input_columns:
  - pt
  - eta
  - status
  - hOverE
  - sigmaIetaIeta
  - ecalIso
  - hcalIso
  - ScoutingRho.fixedGridRhoFastjetAll
  - run
  - luminosityBlock
  - event
  - Generator.weight
  progress: true
workflow:
  DeriveEffectiveArea:
    calibration_train_only: true
    EffectiveArea:
      HOE_EA:
        x: '`ScoutingRho.fixedGridRhoFastjetAll`'
        y: hOverE
        x_title: $\rho$ [GeV]
        y_title: $H/E$
        title: H/E pileup correction
        eta_bins: [0, 1.0, 1.4442, 2.0, 2.2, 2.3, 2.4, 2.5]
        y_type: contour95
        x_bins: [10, 50, 20]
        fitted_func: y = A1*x + A2
      IE_EA:
        x: '`ScoutingRho.fixedGridRhoFastjetAll`'
        y: ecalIso
        x_title: $\rho$ [GeV]
        y_title: $I_{ECAL}$ [GeV]
        title: ECAL pileup correction
        eta_bins: [0, 1.0, 1.4442, 2.0, 2.2, 2.3, 2.4, 2.5]
        y_type: contour95
        x_bins: [10, 50, 20]
        fitted_func: y = A1*x + A2
      IH_EA:
        x: '`ScoutingRho.fixedGridRhoFastjetAll`'
        y: hcalIso
        x_title: $\rho$ [GeV]
        y_title: $I_{HCAL}$ [GeV]
        title: HCAL pileup correction
        eta_bins: [0, 1.0, 1.4442, 2.0, 2.2, 2.3, 2.4, 2.5]
        y_type: contour95
        x_bins: [10, 50, 20]
        fitted_func: y = A1*x + A2
      IE_pt:
        x: pt
        y: ecalIso - IE_EA*`ScoutingRho.fixedGridRhoFastjetAll`
        x_title: $p_T$ [GeV]
        y_title: $I_{ECAL}-\rho EA_{ECAL}$ [GeV]
        title: ECAL pT correction
        eta_bins: [0, 1.4442, 2.5]
        y_type: contour95
        x_bins: [15, 600, 39]
        fitted_func: y = A1*x + A2
      IH_pt1:
        x: pt
        y: hcalIso - IH_EA*`ScoutingRho.fixedGridRhoFastjetAll`
        x_title: $p_T$ [GeV]
        y_title: $I_{HCAL}-\rho EA_{HCAL}$ [GeV]
        title: HCAL pT correction
        eta_bins: [0, 1.4442, 2.5]
        y_type: contour95
        x_bins: [15, 600, 39]
        fitted_func: y = A1*x + A2*x**2 + A3
        coefficient: A1
      IH_pt2:
        x: pt
        y: hcalIso - IH_EA*`ScoutingRho.fixedGridRhoFastjetAll`
        x_title: $p_T$ [GeV]
        y_title: $I_{HCAL}-\rho EA_{HCAL}$ [GeV]
        title: HCAL pT correction
        eta_bins: [0, 1.4442, 2.5]
        y_type: contour95
        x_bins: [15, 600, 39]
        fitted_func: y = A1*x + A2*x**2 + A3
        coefficient: A2
  InspectDistribution:
    regions: [Barrel, Endcap]
    kinematic_reweighting: BACKGROUND
    reweight_binning:
      pt: [10, 15, 20, 30, 50, 80, 100, 150, 200, 300, 500, 800, 1200, 2000, 5000, 10000]
      eta: [-2.5, -2.2, -2.0, -1.5666, -1.4442, -1.0, 0, 1.0, 1.4442, 1.5666, 2.0, 2.2, 2.5]
    stitch_binning: null
    define_variable:
      hOverE_calibrated:
        expression: hOverE - HOE_EA*`ScoutingRho.fixedGridRhoFastjetAll`
        lower: 0
      ecalIso_calibrated:
        expression: ecalIso - IE_EA*`ScoutingRho.fixedGridRhoFastjetAll` - IE_pt*pt
        lower: 0
      hcalIso_calibrated:
        expression: hcalIso - IH_EA*`ScoutingRho.fixedGridRhoFastjetAll` - IH_pt1*pt - IH_pt2*pt**2
        lower: 0
    inspect_variable:
      pt: [10, 15, 20, 30, 50, 80, 100, 150, 200, 300, 500, 800, 1200, 2000]
      eta: [-2.5, 2.5, 25]
      sigmaIetaIeta: [0, 0.05, 50]
      hOverE_calibrated: [-0.1, 0.2, 30]
      ecalIso_calibrated: [0, 20, 40]
      hcalIso_calibrated: [0, 20, 40]
  TrainCutBasedID_TMVA:
    weight_col: training_weight
    # Unweighted signal quantiles bound the search; candidates outside remain in the dataset.
    bound_quantiles: [0.001, 0.99]
    isolation_denominator: none
    efficiency_tolerance: 0.03
    regions: [Barrel, Endcap]
    target_efficiencies: [0.7, 0.8, 0.9]
    n_workers: 2
    # Actual optimizer counts per region; train_ratio reserves 75k more per class for TMVA testing.
    n_train_signal: 300000
    n_train_background: 300000
    training_sampling:
      variable: pt
      edges: [0, 100, null]
      factors: [2.0, 1.0]
    tmva_cycles: 60
    tmva_popsize: 100
    random_seed: 12345
    train_ratio: 0.8
    n_trials: 2
    variables:
      PhotonIso:
        sigmaIetaIeta:
          min: 0
          direction: less
          binning: [0, 0.05, 50]
        hOverE_calibrated:
          min: -999999
          direction: less
          binning: [-0.1, 0.2, 30]
        ecalIso_calibrated:
          min: 0
          direction: less
          binning: [0, 20, 40]
        hcalIso_calibrated:
          min: 0
          direction: less
          binning: [0, 20, 40]
  ValidateID:
    regions: [Barrel, Endcap]
    unit_weights: false
    dedicated_wps: true
    allow_empty_slices: true
    connect_sources: [Optimized(PhotonIso)]
    label: Winter25 ScoutingPhoton GJ; status 1 vs 0,3; XSDB LO weights (Summer24 reference)
    pt_regions:
      pt10to100: [10, 100]
      pt100to300: [100, 300]
      pt300to800: [300, 800]
      pt800plus: [800, null]
    monitor_eff:
      pt:
        label: $p_T$ [GeV]
        xscale: log
        binning: [10, 15, 20, 30, 50, 80, 100, 150, 200, 300, 500, 800, 1200, 2000, 5000, 10000]
      eta:
        label: $\eta$
        binning: [-2.5, 2.5, 25]
      ScoutingRho.fixedGridRhoFastjetAll:
        label: $\rho$ [GeV]
        binning: [0, 80, 16]
    variables: {}
# Export and evaluate the completed WPs using the existing held-out tables.
# --prepared-dir here is PREPARED_ROOT/photon_gj/data, not PREPARED_ROOT.
evaluation:
  correctionlib:
    version: 1
    requirement: pt > 10
  wp_sources:
    PhotonIso:
      path: '{training_dir}/{region}/CutBased_WPs_PhotonIso_TMVA_seq.json'
      isolation_denominator: none
      labels: {WP70: Tight (70%), WP80: Medium (80%), WP90: Loose (90%)}
    Default:
      path: '{config_dir}/../ref_wp/default_photon_{region}.json'
      isolation_denominator: E = max(1, pt*cosh(eta))
      variable_map: {relecalIso: relecalIso_E, relhcalIso: relhcalIso_E}
      labels: {ScoutingPhotonCustomizev1: Customized reference}
  datasets:
    GJetSignal:
      label: GJet prompt photons (status 1)
      path: '{prepared_dir}/{region}/valid/signal.parquet'
      requirement: (status == 1) & (pt > 10)
    GJetBackground:
      label: GJet photon candidates (status 0,3)
      path: '{prepared_dir}/{region}/valid/background.parquet'
      requirement: ((status == 0) | (status == 3)) & (pt > 10)
  comparisons:
    GJet:
      signal: GJetSignal
      backgrounds: [GJetBackground]
      label: 'Winter25 GJet: prompt vs unmatched/nonprompt; physical weights'
  validation:
    connect_sources: [PhotonIso]
    # Preserve the TnP reference's raw I/E, without EA or pT corrections.
    define_variable:
      reference_energy: {expression: 'pt*cosh(eta)', lower: 1}
      relecalIso_E: ecalIso/reference_energy
      relhcalIso_E: hcalIso/reference_energy
    # Keep physical weights when projecting columns; never substitute training_weight.
    input_columns: [sample, status, weight, pt, eta, ScoutingRho.fixedGridRhoFastjetAll,
      sigmaIetaIeta, hOverE, ecalIso, hcalIso,
      hOverE_calibrated, ecalIso_calibrated, hcalIso_calibrated]
    # The shared cut plots show pre-ID shapes, WP boundaries and single-cut efficiencies.
    cut_distributions:
      sigmaIetaIeta:
        label: '$\sigma_{i\eta i\eta}$'
        binning: [0, 0.05, 50]
        by_region:
          Endcap: {binning: [0, 0.08, 80]}
      hOverE_calibrated:
        label: 'Corrected $H/E$'
        binning: [0, 0.3, 60]
      ecalIso_calibrated:
        label: 'Corrected ECAL isolation [GeV]'
        binning: [0, 20, 80]
      hcalIso_calibrated:
        label: 'Corrected HCAL isolation [GeV]'
        binning: [0, 20, 80]
      hOverE:
        label: 'Raw $H/E$'
        binning: [0, 0.3, 60]
      relecalIso_E:
        label: 'Raw ECAL isolation / $E$'
        binning: [0, 1, 80]
      relhcalIso_E:
        label: 'Raw HCAL isolation / $E$'
        binning: [0, 2, 80]
  plot_style:
    preset: id_comparison
    source_markers: {PhotonIso: o, Default: s}
    roc_outputdir: '{outputdir}/ROC'
    roc_filename_prefix: '{comparison}_'
    # Pies show unweighted status counts before ID; ROC efficiencies retain physical weights.
    composition:
      enabled: true
      column: status
      categories:
        1: {label: prompt, color: '#56B4E9'}
        3: {label: nonprompt, color: '#CC79A7'}
        0: {label: unmatched, color: '#999999'}
    cut_distributions:
      samples:
        GJetSignal: {label: GJet prompt, color: '#3B4CC0'}
        GJetBackground: {label: GJet unmatched/nonprompt, color: '#007F8B'}
    # PhotonIso WP70, WP80, WP90, then the customized reference.
    process_palettes:
      GJetSignal: ['#7F2704', '#D94801', '#F58D3C', '#955B48']
      GJetBackground: ['#123B63', '#236C99', '#4E9FC1', '#606B87']
