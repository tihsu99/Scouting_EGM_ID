inputdir: /eos/user/t/tihsu/dataset/scouting_id/id_parquet_v1_merged
process:
    # Sample lists define the source MC; status selects electrons within each sample.
    signal:
        requirement: "((status == 1)|(status == 2)) & (pt > 10) & ((abs(eta) < 1.4442) | ((abs(eta) > 1.566) & (abs(eta) < 2.5)))"
        samples:
            DYToLL_M50: 1.0
    background:
        requirement: "((status == 0)|(status == 3)) & (pt > 10) & ((abs(eta) < 1.4442) | ((abs(eta) > 1.566) & (abs(eta) < 2.5)))"
        samples:
            TT: 1.0

region_definition:
    # Exclude the ECAL transition region, including both boundaries.
    # https://twiki.cern.ch/twiki/bin/view/CMSPublic/DP2024041
    Barrel:
        requirement: "(abs(eta) < 1.4442)"
    Endcap:
        requirement: "(abs(eta) > 1.566) & (abs(eta) < 2.5)"
    Barrel+Endcap:
        requirement: "(abs(eta) < 1.4442) | ((abs(eta) > 1.566) & (abs(eta) < 2.5))"
n_files: -1
random_seed: 42
# Match the completed calibration's candidate split and input row order.
split_columns: [sample, sample_row]
normalization: {}

plot_style:
    formats: [pdf, png]
    wp_label_format: "{label}"
    wp_palette: ["#0072B2", "#56B4E9", "#3B4CC0", "#009E73"]
    cut_distributions:
        samples:
            DY: {label: DY, color: "#3B4CC0"}
            TT: {label: '$t\bar{t}$', color: "#007F8B"}
    max_series_per_panel: 8
    rc_params:
        figure.figsize: [10, 8]
        font.size: 22
        legend.fontsize: 12
        legend.title_fontsize: 14
        savefig.dpi: 150
    legend:
        loc: lower right
        frameon: false
        borderaxespad: 1.5
    cms_label:
        label: Preliminary
        data: false
        com: 13.6
        loc: 0
        fontsize: 20

