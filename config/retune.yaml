    InspectDistribution:
        skip: true
        progress: true
        # Input candidates per sample, before truth/region cuts: DY and TT each
        # get an independent 6M-row cap. null or -1 reads all rows.
        max_rows_per_sample: 2000000
        batch_size: 200000
        # Read only the raw inputs used below; omit/null to retain every column.
        input_columns:
            - pt
            - eta
            - phi
            - status
            - hOverE
            - missingHits
            - dEtaIn
            - dPhiIn
            - ooEMOop
            - ecalIso
            - hcalIso
            - trackIso
            - r9
            - sigmaIetaIeta
            - ScoutingRho.fixedGridRhoFastjetAll
        kinematic_reweighting: BACKGROUND
        training_weight_mode: absolute
        reweight_binning:
            pt: [10, 15, 20, 30, 40, 60, 80, 120, 200, 300, 500, 700, 1000, 2000, 5000, 10000]
            eta: [-2.5, -2.0, -1.566, -1.4442, -1.0, -0.5, 0.0, 0.5, 1.0, 1.4442, 1.566, 2.0, 2.5]
        stitch_binning: null
        plotdir:  /eos/user/t/tihsu/dataset/scouting_id/distributions
        storedir: /eos/user/t/tihsu/dataset/scouting_id/data
        shuffle: True
        train_ratio: 0.8
        regions: 
            - Barrel
            - Endcap
        correction_lib: "/eos/user/t/tihsu/dataset/scouting_id/calibration_pt/EffectiveArea/corrections_all.json"
        define_variable:
           # Apply bounds outside expression evaluation for older CERN pandas.
           "IE_scale": {expression: "IE_scale", lower: 0}
           "IH_scale": {expression: "IH_scale", lower: 0}
           "IT_scale": {expression: "IT_scale", lower: 0}
           "Esc": "pt*cosh(eta)"
           # H/E retains E; isolation follows the pT-based calibration.
           "hOverE_calibrated": "hOverE-(c_rho * `ScoutingRho.fixedGridRhoFastjetAll` + c_E)/Esc"
           "relecalIso": {expression: "ecalIso/pt", lower: 0}
           "relhcalIso": {expression: "hcalIso/pt", lower: 0}
           "reltrackIso": {expression: "trackIso/pt", lower: 0}
           "relecalIsoWithEA": {expression: "(ecalIso-`ScoutingRho.fixedGridRhoFastjetAll`*IE_EA)/pt", lower: 0}
           "relecalIsoWithEA_calibrated": {expression: "relecalIsoWithEA - IE_scale/pt", lower: 0}
           "relhcalIsoWithEA": {expression: "(hcalIso-`ScoutingRho.fixedGridRhoFastjetAll`*IH_EA)/pt", lower: 0}
           "relhcalIsoWithEA_calibrated": {expression: "relhcalIsoWithEA - IH_scale/pt", lower: 0}
           "reltrackIsoWithEA": {expression: "(trackIso-`ScoutingRho.fixedGridRhoFastjetAll`*IT_EA)/pt", lower: 0}
           "reltrackIsoWithEA_calibrated": {expression: "reltrackIsoWithEA - IT_scale/pt", lower: 0}
           "abs_dEtaIn": "abs(dEtaIn)"
           "abs_dPhiIn": "abs(dPhiIn)"
           "abs_ooEMOop": "abs(ooEMOop)"
        inspect_variable:
            pt: [10, 15, 20, 30, 50, 80, 120, 200, 300, 500, 700, 1000]
            eta: [-3, 3, 24]
            hOverE: [0, 0.2, 20]
            hOverE_calibrated: [-0.1, 0.2, 30]
            phi: [-3.2, 3.2, 40]
            missingHits: [0, 4, 4]
            abs_dEtaIn: [0, 0.2, 20]
            abs_dPhiIn: [0, 0.2, 20]
            abs_ooEMOop: [0, 0.2, 20]
            ooEMOop: [-0.2, 0.2, 40]
            ecalIso: [0, 20, 40]
            hcalIso: [0, 20, 40]
            trackIso: [0, 20, 40]
            relecalIsoWithEA_calibrated: [0, 2, 40]
            relhcalIsoWithEA_calibrated: [0, 2, 40]
            reltrackIsoWithEA_calibrated: [0, 2, 40]
            relecalIso: [0, 2, 40]
            relhcalIso: [0, 2, 40]
            reltrackIso: [0, 2, 40]
            r9: [0, 1.0, 40]
            sigmaIetaIeta: [0, 0.05, 20]


    TrainCutBasedID_TMVA:
        plot_samples: {signal: DY, background: TT}
        cut_plot_variables:
            missingHits: {label: 'Missing inner hits', binning: [-0.5, 5.5, 6]}
        fixed_cuts:
            Iso: &electron_fixed_cuts
                WP95: {missingHits: {max: 2}}
                WP90: {missingHits: {max: 1}}
                WP80: {missingHits: {max: 1}}
                WP70: {missingHits: {max: 1}}
            noIso: *electron_fixed_cuts
        weight_col: training_weight
        isolation_denominator: pt
        efficiency_tolerance: 0.03
        inputdir: /eos/user/t/tihsu/dataset/scouting_id/data
        outputdir: /eos/user/t/tihsu/dataset/scouting_id/train
        regions:
            - Barrel
            - Endcap
        target_efficiencies: [0.7, 0.8, 0.9, 0.95]
        n_workers: 4
        n_signal: 300000
        n_background: 300000
        tmva_cycles: 60
        tmva_popsize: 100
        random_seed: 12345
        train_ratio: 0.8
        n_trials: 2
        variables:
          Iso:
            hOverE_calibrated:
                min: 0
                max: 999999
                direction: less
                binning: [0, 0.2, 20]
            relecalIsoWithEA_calibrated:
                min: 0
                max: 999999
                direction: less
                binning: [0, 2, 40]
            reltrackIsoWithEA_calibrated:
                min: 0
                max: 999999
                direction: less
                binning: [0, 2, 40]
            relhcalIsoWithEA_calibrated:
                min: 0
                max: 999999
                direction: less
                binning: [0, 2, 40]
            sigmaIetaIeta:
                min: 0
                max: 999999
                direction: less
                binning: [0, 0.05, 20]
            abs_dEtaIn:
                min: 0
                max: 999999
                direction: less
                binning: [0, 0.2, 20]
            abs_dPhiIn:
                min: 0
                max: 999999
                direction: less
                binning: [0, 0.2, 20]
            abs_ooEMOop:
                min: 0
                max: 99999
                direction: less
                binning: [0, 0.2, 20]

          noIso:
            hOverE_calibrated:
                min: 0
                max: 999999
                direction: less
                binning: [0, 0.2, 20]
            sigmaIetaIeta:
                min: 0
                max: 999999
                direction: less
                binning: [0, 0.05, 20]
            abs_dEtaIn:
                min: 0
                max: 999999
                direction: less
                binning: [0, 0.2, 20]
            abs_dPhiIn:
                min: 0
                max: 999999
                direction: less
                binning: [0, 0.2, 20]
            abs_ooEMOop:
                min: 0
                max: 99999
                direction: less
                binning: [0, 0.2, 20]


