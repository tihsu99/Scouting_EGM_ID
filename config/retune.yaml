    InspectDistribution:
        skip: False
        progress: true
        # Input candidates per sample, before truth/region cuts: DY and TT each
        # get an independent 2M-row cap. null or -1 reads all rows.
        max_rows_per_sample: 2000000
        batch_size: 100000
        kinematic_reweighting: BACKGROUND
        training_weight_mode: absolute
        reweight_binning:
            pt: [10, 15, 20, 30, 40, 60, 80, 120, 200, 300, 500, 700, 1000, 2000, 5000, 10000]
            eta: [-2.5, -2.0, -1.566, -1.4442, -1.0, -0.5, 0.0, 0.5, 1.0, 1.4442, 1.566, 2.0, 2.5]
        stitch_binning: null
        plotdir:  /eos/user/t/tihsu/dataset/scouting_id/distributions
        storedir: /eos/user/t/tihsu/dataset/scouting_id/data
        shuffle: True
        train_ratio: 0.8
        regions: 
            - Barrel
            - Endcap
        correction_lib: "/eos/user/t/tihsu/dataset/scouting_id/calibration_pt/EffectiveArea/corrections_all.json"
        define_variable:
           # Constrain fitted scale terms when applying the saved corrections.
           "IE_scale": "IE_scale.clip(lower=0)"
           "IH_scale": "IH_scale.clip(lower=0)"
           "IT_scale": "IT_scale.clip(lower=0)"
           "Esc": "pt*cosh(eta)"
           # H/E retains E; isolation follows the pT-based calibration.
           "hOverE_calibrated": "hOverE-(c_rho * `ScoutingRho.fixedGridRhoFastjetAll` + c_E)/Esc"
           "relecalIso": "(ecalIso/pt).clip(lower=0)"
           "relhcalIso": "(hcalIso/pt).clip(lower=0)"
           "reltrackIso": "(trackIso/pt).clip(lower=0)"
           "relecalIsoWithEA": "((ecalIso-`ScoutingRho.fixedGridRhoFastjetAll`*IE_EA)/pt).clip(lower=0)"
           "relecalIsoWithEA_calibrated": "(relecalIsoWithEA - IE_scale/pt).clip(lower=0)"
           "relhcalIsoWithEA": "((hcalIso-`ScoutingRho.fixedGridRhoFastjetAll`*IH_EA)/pt).clip(lower=0)"
           "relhcalIsoWithEA_calibrated": "(relhcalIsoWithEA - IH_scale/pt).clip(lower=0)"
           "reltrackIsoWithEA": "((trackIso-`ScoutingRho.fixedGridRhoFastjetAll`*IT_EA)/pt).clip(lower=0)"
           "reltrackIsoWithEA_calibrated": "(reltrackIsoWithEA - IT_scale/pt).clip(lower=0)"
           "abs_dEtaIn": "abs(dEtaIn)"
           "abs_dPhiIn": "abs(dPhiIn)"
           "abs_ooEMOop": "abs(ooEMOop)"
        inspect_variable:
            pt: [10, 15, 20, 30, 50, 80, 120, 200, 300, 500, 700, 1000]
            eta: [-3, 3, 24]
            hOverE: [0, 0.2, 20]
            hOverE_calibrated: [-0.1, 0.2, 30]
            phi: [-3.2, 3.2, 40]
            missingHits: [0, 4, 4]
            abs_dEtaIn: [0, 0.2, 20]
            abs_dPhiIn: [0, 0.2, 20]
            abs_ooEMOop: [0, 0.2, 20]
            ooEMOop: [-0.2, 0.2, 40]
            ecalIso: [0, 20, 40]
            hcalIso: [0, 20, 40]
            trackIso: [0, 20, 40]
            relecalIsoWithEA_calibrated: [0, 2, 40]
            relhcalIsoWithEA_calibrated: [0, 2, 40]
            reltrackIsoWithEA_calibrated: [0, 2, 40]
            relecalIso: [0, 2, 40]
            relhcalIso: [0, 2, 40]
            reltrackIso: [0, 2, 40]
            r9: [0, 1.0, 40]
            sigmaIetaIeta: [0, 0.05, 20]
