# Run with postprocess.py, not analysis.py. This config defaults to preparation only.
# Example input: /eos/user/t/tihsu/dataset/scouting_id/id_parquet_v1_merged
# Choose a new --outputdir; completed calibration stays at the path below.
base_config: standard.yaml
steps: [prepare]
correction_lib: /eos/user/t/tihsu/dataset/scouting_id/calibration_pt/EffectiveArea/corrections_all.json
default_wp: ../ref_wp/default_{region}.json
calibration_samples: [DYToLL_M50]

# Prompt/direct-tau electrons are signal; unmatched/other matched electrons are fake.
signal_requirement: "((status == 1) | (status == 2)) & (pt > 10) & (abs(eta) < 2.5)"
background_requirement: "((status == 0) | (status == 3)) & (pt > 10) & (abs(eta) < 2.5)"
training_weight_mode: absolute

studies:
  dy_tt:
    signal: [DYToLL_M50]
    background: [TT]
  dy_qcd_em:
    signal: [DYToLL_M50]
    background:
      - QCD_EMEnriched_Pt_20to30
      - QCD_EMEnriched_Pt_30to50
      - QCD_EMEnriched_Pt_50to80
#
## Set verified effective cross sections in pb for the exact DAS datasets in
## ntuplizer.yaml. Include matching/filter efficiency once, never twice.
## Null values intentionally stop preparation; unit weights cannot stitch QCD.
## Receipts must provide preselection sum_genweight and generator-bin bounds.
## Physical weight = luminosity_pb * cross_section_pb * Generator.weight / sum_genweight.
#normalization:
#  luminosity_pb: 1.0
#  groups:
#    DY:
#      samples: [DYToLL_M50]
#      cross_section_pb: null
#    TT:
#      samples: [TT]
#      cross_section_pb: null
#    QCD_EMEnriched_Pt_20to30:
#      samples: [QCD_EMEnriched_Pt_20to30]
#      cross_section_pb: null
#      stitch_family: QCD_EM
#      generator_range: [20, 30]
#    QCD_EMEnriched_Pt_30to50:
#      samples: [QCD_EMEnriched_Pt_30to50]
#      cross_section_pb: null
#      stitch_family: QCD_EM
#      generator_range: [30, 50]
#    QCD_EMEnriched_Pt_50to80:
#      samples: [QCD_EMEnriched_Pt_50to80]
#      cross_section_pb: null
#      stitch_family: QCD_EM
#      generator_range: [50, 80]
# The EM-enriched set covers generator pT [20, 80), not the inclusive QCD spectrum.
# Generator bins overlap in reconstructed electron pT: do not cut/stitch on electron pT.
# Each bin is normalized independently, then summed before kinematic reweighting.

shared:
  n_files: -1
  random_seed: 42
  train_ratio: 0.8
  # Match calibration.yaml exactly; preserve the same files and original row order.
  # This is a candidate split, not an event-disjoint validation sample.
  split_columns: [sample, sample_row]

workflow_overrides:
  InspectDistribution:
    regions: [Barrel, Endcap]
    train_ratio: 0.8
    # BACKGROUND is the target: reweight DY training candidates to the combined
    # background (pt, eta) shape, separately for each study and detector region.
    # SIGNAL instead reweights the background to DY. Validation keeps physical weights.
    kinematic_reweighting: BACKGROUND
    reweight_binning:
      pt: [10, 15, 20, 30, 40, 60, 80, 120, 200, 300, 500, 700, 1000, 2000, 5000, 10000]
      eta: [-2.5, -2.0, -1.479, -1.0, -0.5, 0.0, 0.5, 1.0, 1.479, 2.0, 2.5]
    # Audit the physical electron-pT spectrum per sample and in total.
    # This controls the diagnostic histogram, not generator-bin membership.
    stitch_binning: [10, 15, 20, 30, 40, 50, 60, 80, 100, 120, 170, 200, 300, 500, 1000, 2000, 5000, 10000]
    define_variable:
      Esc: "pt*cosh(eta)"
      hOverE_calibrated: "hOverE-(c_rho*`ScoutingRho.fixedGridRhoFastjetAll`+c_E)/Esc"
      # Preserve raw E-normalized inputs for the checked-in reference WPs.
      relecalIso: "ecalIso/Esc"
      relhcalIso: "hcalIso/Esc"
      reltrackIso: "trackIso/Esc"
      # The new calibration uses pT-normalized isolation and 1/pT scale fits.
      relecalIsoPt: "ecalIso/pt"
      relhcalIsoPt: "hcalIso/pt"
      reltrackIsoPt: "trackIso/pt"
      relecalIsoWithEA: "(ecalIso-`ScoutingRho.fixedGridRhoFastjetAll`*IE_EA)/pt"
      relecalIsoWithEA_calibrated: "relecalIsoWithEA-IE_scale/pt"
      relhcalIsoWithEA: "(hcalIso-`ScoutingRho.fixedGridRhoFastjetAll`*IH_EA)/pt"
      relhcalIsoWithEA_calibrated: "relhcalIsoWithEA-IH_scale/pt"
      reltrackIsoWithEA: "(trackIso-`ScoutingRho.fixedGridRhoFastjetAll`*IT_EA)/pt"
      reltrackIsoWithEA_calibrated: "reltrackIsoWithEA-IT_scale/pt"
      abs_dEtaIn: "abs(dEtaIn)"
      abs_dPhiIn: "abs(dPhiIn)"
      abs_ooEMOop: "abs(ooEMOop)"
    # Negative corrected values remain available; no zero clipping is applied.
    inspect_variable:
      pt: [10, 15, 20, 30, 40, 50, 60, 80, 120, 200, 300, 500, 1000]
      eta: [-2.5, 2.5, 50]
      ScoutingRho.fixedGridRhoFastjetAll: [0, 80, 40]
      hOverE: [0, 0.2, 40]
      hOverE_calibrated: [-0.1, 0.2, 60]
      sigmaIetaIeta: [0, 0.05, 50]
      r9: [0, 1.2, 48]
      missingHits: [-0.5, 4.5, 5]
      abs_dEtaIn: [0, 0.2, 40]
      abs_dPhiIn: [0, 0.2, 40]
      abs_ooEMOop: [0, 0.2, 40]
      relecalIsoPt: [0, 2, 80]
      relhcalIsoPt: [0, 2, 80]
      reltrackIsoPt: [0, 2, 80]
      relecalIsoWithEA: [-0.5, 2, 100]
      relhcalIsoWithEA: [-0.5, 2, 100]
      reltrackIsoWithEA: [-0.5, 2, 100]
      relecalIsoWithEA_calibrated: [-0.5, 2, 100]
      relhcalIsoWithEA_calibrated: [-0.5, 2, 100]
      reltrackIsoWithEA_calibrated: [-0.5, 2, 100]
  # Keep later training metadata consistent if --steps train is requested.
#  TrainCutBasedID_TMVA:
#    isolation_denominator: pt
