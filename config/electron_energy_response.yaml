# DY prompt/tau response diagnostic, including status 5 tails before any pT selection.
sample_label: DY prompt/tau, including pT mismatch
input_format: miniaod  # miniaod, nano, or parquet; use --dataset for DAS discovery.
max_files: 1
das_instance: prod/global
miniAOD_production_config: ntuplizer.yaml  # Reuse the CMSSW area, scouting recipe, and input redirector.
scratch_dir: /tmp
tree: Events
batch_size: 20000
max_events: 10000  # Total MiniAOD/Nano event cap; -1 reads everything.
max_rows: 100000  # Only for direct Parquet input; candidate rows, not events.
weight_branch: Generator_weight  # null selects unit candidate weights.
parquet_weight_column: Generator.weight
gen_matching_dR: 0.1
electron_response_max_relative_pt: 0.5
signal_status: [1, 2, 5]  # Keep failed-response prompt/tau candidates in the diagnostic.
reco_requirement: (pt > 10) & ((abs(eta) < 1.4442) | ((abs(eta) > 1.5666) & (abs(eta) < 2.5)))

# Raw inputs for full electron correctionlib WPs; event scalars are broadcast per candidate.
cache_columns:
  sigmaIetaIeta: ScoutingElectron_sigmaIetaIeta
  dEtaIn: ScoutingElectron_dEtaIn
  dPhiIn: ScoutingElectron_dPhiIn
  ooEMOop: ScoutingElectron_ooEMOop
  missingHits: ScoutingElectron_missingHits
  ecalIso: ScoutingElectron_ecalIso
  hcalIso: ScoutingElectron_hcalIso
  trackIso: ScoutingElectron_trackIso
  ScoutingRho.fixedGridRhoFastjetAll: ScoutingRho_fixedGridRhoFastjetAll

wp_response:
  binning: [0, 2.5, 100]
  yscales: [linear, log]
  groups: [all, high]
  inclusive: true
  reference_lines: [0.5, 1.0, 1.5]
  # Strictest to loosest; nesting is checked on every selected candidate.
  wps:
    - {name: Iso/WP70, label: WP70, color: '#B2182B'}
    - {name: Iso/WP80, label: WP80, color: '#EF6548'}
    - {name: Iso/WP90, label: WP90, color: '#FDB863'}
    - {name: Iso/WP95, label: WP95, color: '#FEE08B'}
  fail_color: '#C7C7C7'

# Gen-pT bins retain low-response electrons that migrate below a reco-pT boundary.
pt_variable: gen_pt  # Alternatively: pt, to bin in reco pT.
pt_bins: [10, 20, 30, 50, 100, 300, 800, null]
region_definition:
  Barrel:
    requirement: abs(eta) < 1.4442
    label: 'Barrel, $|\eta^{reco}| < 1.4442$'
  Endcap:
    requirement: (abs(eta) > 1.5666) & (abs(eta) < 2.5)
    label: 'Endcap, $1.5666 < |\eta^{reco}| < 2.5$'

hoe_groups:
  all:
    requirement: hOverE >= 0
    label: All nonnegative H/E
  low:
    requirement: (hOverE >= 0) & (hOverE <= 0.05)
    label: '$0 \leq H/E \leq 0.05$'
    color: '#0072B2'
  high:
    requirement: hOverE > 0.05
    label: '$H/E > 0.05$'
    color: '#D55E00'
  mid:
    requirement: (hOverE > 0.05) & (hOverE <= 0.10)
    label: '$0.05 < H/E \leq 0.10$'
    color: '#E69F00'
  large:
    requirement: (hOverE > 0.10) & (hOverE <= 0.20)
    label: '$0.10 < H/E \leq 0.20$'
    color: '#D55E00'
  very_large:
    requirement: hOverE > 0.20
    label: '$H/E > 0.20$'
    color: '#A12864'
plot_groups: [all, high]

response_binning: [0, 2.5, 100]  # min, max, number of bins; tails remain in normalization.
hoe_binning: [0, 0.5, 50]
color_scale: auto  # Log for nonnegative weights; signed log if any bins are negative.
colormap: viridis
signed_colormap: RdBu_r
hoe_reference_lines: [0.05]
additional_response_axes:
  gen_dR:
    label: '$\Delta R(\mathrm{reco},\mathrm{gen})$'
    binning: [0, 0.105, 70]
    reference_lines: [0.1]
    note: 'Stored prompt/tau matches already pass the production DeltaR cut; no new matching cut is applied.'
response_reference_lines: [0.5, 1.0, 1.5]
# Report the rejected fraction for this proposed pT cut, without applying it.
relative_pt_threshold: 0.5
plot_style:
  formats: [png, pdf]
  cms_label: {label: Simulation Preliminary, data: false, com: 13.6, fontsize: 16}
  rc_params: {figure.figsize: [10, 8], font.size: 15, legend.fontsize: 12, savefig.dpi: 150}
