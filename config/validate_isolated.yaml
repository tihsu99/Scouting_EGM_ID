# Reuse the exact feature definitions, corrections and detector regions of this training.
# DY/TT come from its saved validation split; QCD HT and Zprime are independent samples.
base_config: retune.yaml
regions: [Barrel, Endcap]

# Export includes this fiducial cut and the base configuration's region selection.
correctionlib:
  version: 1
  requirement: "pt > 10"

preparation:
  progress: true
  # Per-sample prefix cap, before cuts. null reads all candidates and needs more memory.
  # This also changes the QCD bin mixture; use the same setting for comparisons.
  max_rows_per_sample: 2000000
  batch_size: 200000

datasets:
  DY:
    label: 'DY prompt or from $\tau$'
    path: "{prepared_dir}/{region}/valid/signal.parquet"
    requirement: "(sample == 'DYToLL_M50') & ((status == 1) | (status == 2)) & (pt > 10)"
  TT:
    label: TT unmatched or nonprompt
    path: "{prepared_dir}/{region}/valid/background.parquet"
    requirement: "(sample == 'TT') & ((status == 0) | (status == 3)) & (pt > 10)"
  QCD:
    label: QCD unmatched or nonprompt
    requirement: "((status == 0) | (status == 3)) & (pt > 10)"
    samples:
      - QCD_HT_40to70
      - QCD_HT_70to100
      - QCD_HT_100to200
      - QCD_HT_200to400
      - QCD_HT_400to600
      - QCD_HT_600to800
      - QCD_HT_800to1000
      - QCD_HT_1000to1200
      - QCD_HT_1200to1500
      - QCD_HT_1500to2000
      - QCD_HT_2000
  Zprime:
    label: 'Zprime 6 TeV prompt or from $\tau$'
    requirement: "((status == 1) | (status == 2)) & (pt > 10)"
    samples: [ZprimeTo2E_M6000]

comparisons:
  DY:
    signal: DY
    backgrounds: [TT, QCD]
    label: "DY: prompt / from $\\tau$\nTT/QCD: unmatched / nonprompt"
  Zprime:
    signal: Zprime
    backgrounds: [TT, QCD]
    label: "Zprime 6 TeV: prompt / from $\\tau$\nTT/QCD: unmatched / nonprompt"

wp_sources:
  Iso:
    path: "{training_dir}/{region}/CutBased_WPs_Iso_TMVA_seq.json"
    isolation_denominator: pt
  Default:
    path: "{config_dir}/../ref_wp/default_{region}.json"
    # The default JSON uses raw I/E. Never reuse the retune's raw I/pT columns.
    variable_map:
      relecalIso: relecalIso_E
      relhcalIso: relhcalIso_E
      reltrackIso: reltrackIso_E
    labels:
      ScoutingElectronRecommendv1: Recommend
      ScoutingElectronCustomizev1: AXOL1TL

validation:
  unit_weights: true
  # Fit before any ID cut, separately per detector region; only ROC weights change.
  roc_reweight:
    source: QCD
    target: TT
    binning:
      pt: [10, 15, 20, 30, 40, 60, 80, 120, 200, 300, 500, 700, 1000, 2000, 5000, 10000]
      eta: [-2.5, 2.5, 10]
  # Project only inputs used by the isolated/default WPs, selections and monitors.
  input_columns:
    - sample
    - status
    - pt
    - eta
    - ScoutingRho.fixedGridRhoFastjetAll
    - ecalIso
    - hcalIso
    - trackIso
    - hOverE
    - missingHits
    - hOverE_calibrated
    - sigmaIetaIeta
    - abs_dEtaIn
    - abs_dPhiIn
    - abs_ooEMOop
    - relecalIsoWithEA_calibrated
    - relhcalIsoWithEA_calibrated
    - reltrackIsoWithEA_calibrated
  define_variable:
    relecalIso_E: "ecalIso/(pt*cosh(eta))"
    relhcalIso_E: "hcalIso/(pt*cosh(eta))"
    reltrackIso_E: "trackIso/(pt*cosh(eta))"
  # Connecting the discrete derived WPs is a guide, not a continuous threshold scan.
  connect_sources: [Iso]
  dedicated_wps: true
  allow_empty_slices: true
  pt_regions:
    pt10to100: [10, 100]
    pt100to300: [100, 300]
    pt300to800: [300, 800]
    pt800plus: [800, null]
  monitor_eff:
    pt:
      label: '$p_T$ [GeV]'
      xscale: log
      binning: [10, 15, 20, 30, 50, 80, 100, 150, 200, 300, 500, 800, 1200, 2000, 3000, 5000, 10000]
    eta:
      label: '$\eta$'
      binning: [-2.5, 2.5, 25]
    ScoutingRho.fixedGridRhoFastjetAll:
      label: '$\rho$ [GeV]'
      binning: [0, 80, 16]
  variables: {}
  # Pre-ID shapes use base validation weights. Right-axis efficiencies use all selected rows.
  cut_distributions:
    hOverE_calibrated:
      label: 'Corrected $H/E$'
      binning: [0, 0.2, 50]
    relecalIsoWithEA_calibrated:
      label: 'Corrected ECAL isolation / $p_T$'
      binning: [0, 2, 80]
    relhcalIsoWithEA_calibrated:
      label: 'Corrected HCAL isolation / $p_T$'
      binning: [0, 2, 80]
    reltrackIsoWithEA_calibrated:
      label: 'Corrected track isolation / $p_T$'
      binning: [0, 0.4, 80]
    sigmaIetaIeta:
      label: '$\sigma_{i\eta i\eta}$'
      binning: [0, 0.05, 50]
      by_region:
        Endcap: {binning: [0, 0.08, 80]}
    abs_dEtaIn:
      label: '$|\Delta\eta_{\mathrm{in}}|$'
      binning: [0, 0.03, 60]
    abs_dPhiIn:
      label: '$|\Delta\phi_{\mathrm{in}}|$'
      binning: [0, 0.15, 60]
    abs_ooEMOop:
      label: '$|1/E - 1/p|$ [GeV$^{-1}$]'
      binning: [0, 0.1, 50]
    missingHits:
      label: 'Missing inner hits'
      binning: [-0.5, 5.5, 6]
    hOverE:
      label: 'Raw $H/E$'
      binning: [0, 0.3, 60]
    relecalIso_E:
      label: 'Raw ECAL isolation / $E$'
      binning: [0, 1, 80]
    relhcalIso_E:
      label: 'Raw HCAL isolation / $E$'
      binning: [0, 1, 80]
    reltrackIso_E:
      label: 'Raw track isolation / $E$'
      binning: [0, 0.2, 80]

plot_style:
  preset: id_comparison
  cut_distributions:
    samples:
      DY: {label: DY, color: "#3B4CC0"}
      TT: {label: '$t\bar{t}$', color: "#007F8B"}
      QCD: {label: QCD, color: "#8073AC"}
      Zprime: {label: Zprime, color: "#3B4CC0"}
    legend: {loc: upper right, ncol: 1, fontsize: 10, borderaxespad: 0.8}
  composition:
    enabled: true
    column: status
    categories:
      1: {label: prompt, color: "#56B4E9"}
      2: {label: 'from $\tau$', color: "#E69F00"}
      3: {label: nonprompt, color: "#CC79A7"}
      0: {label: unmatched, color: "#999999"}
  source_markers: {Iso: o, Default: s}
  roc_outputdir: "{outputdir}/ROC"
  roc_filename_prefix: "{comparison}_"
  # ROC overlays distinguish samples with separate palettes.
  # All palettes follow source/WP order:
  # Iso WP70, WP80, WP90, WP95, Default Recommend, Default AXOL1TL.
  # TT uses cool colors, QCD uses warm colors, and Default WPs use grays.
  # Each signal/background efficiency pair shares the background palette.
  process_palettes:
    TT: ["#0072B2", "#56B4E9", "#3B4CC0", "#009E73", "#111111", "#606060"]
    QCD: ["#D55E00", "#E69F00", "#CC6677", "#AA3377", "#808080", "#B0B0B0"]
    DY: &signal_palette ["#0072B2", "#56B4E9", "#3B4CC0", "#009E73", "#111111", "#707070"]
    Zprime: *signal_palette
  cms_label:
    com: 13.6
