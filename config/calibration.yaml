# Run with: python3 analysis.py --config-path config/calibration.yaml --local-scheduler
inputdir: /eos/user/t/tihsu/dataset/scouting_id/id_parquet_v1_merged
process:
    signal:
        samples:
            DYToLL_M50: 1.0

n_files: -1
n_workers: 4
random_seed: 42
train_ratio: 0.8
# Preserve the original single-DY, unit-candidate-weight calibration.
normalization: {}

plot_style:
    rc_params:
        figure.figsize: [10, 8]
        font.size: 22
        legend.fontsize: 12
        savefig.dpi: 150
    legend:
        loc: upper left
        frameon: false
        borderaxespad: 1.5
    cms_label:
        label: Preliminary
        data: false
        com: 13.6
        loc: 0
        fontsize: 20

workflow:
    DeriveEffectiveArea:
        skip: false
        isolation_denominator: pt
        plotdir: /eos/user/t/tihsu/dataset/scouting_id/calibration_pt/EffectiveArea
        requirement: "((status == 1) | (status == 2)) & (pt > 10) & (abs(eta) < 2.5)"
        # Use the same event split as subsequent feature preparation.
        calibration_train_only: true
        calibration_weight_mode: nonnegative
        EffectiveArea:
            # H/E retains E = pt*cosh(eta) in both calibration steps.
            c_rho:
                x_title: "$\\rho$"
                y_title: "$E_{HCAL}$"
                title: "$c_{\\rho}$"
                x: "`ScoutingRho.fixedGridRhoFastjetAll`"
                y: "pt*cosh(eta)*hOverE"
                eta_bins: [0, 0.5, 1.0, 1.5, 2.0, 2.5]
                y_type: "contour90"
                x_bins: [0, 80, 16]
                fitted_func: "y = A1*x + A2"
            c_E:
                x_title: "$E_{SC}$ [GeV]"
                y_title: "$H/E-C_{\\rho}\\rho/E$"
                title: "$c_E$"
                x: "pt*cosh(eta)"
                y: "hOverE-(c_rho*`ScoutingRho.fixedGridRhoFastjetAll`/(pt*cosh(eta)))"
                eta_bins: [0, 0.5, 1.0, 1.5, 2.0, 2.5]
                y_type: "mean"
                x_bins: [0, 500, 50]
                fitted_func: "y = A1*x + A2"
            IE_EA:
                x_title: "$\\rho$"
                y_title: "$iso_{ECAL}$ [GeV]"
                title: "$EA_{ECAL}$"
                x: "`ScoutingRho.fixedGridRhoFastjetAll`"
                y: "ecalIso"
                eta_bins: [0, 1.0, 1.5, 2.0, 2.2, 2.3, 2.4, 2.5]
                y_type: "mean"
                x_bins: [0, 80, 16]
                fitted_func: "y = A1*x + A2"
            IH_EA:
                x_title: "$\\rho$"
                y_title: "$iso_{HCAL}$ [GeV]"
                title: "$EA_{HCAL}$"
                x: "`ScoutingRho.fixedGridRhoFastjetAll`"
                y: "hcalIso"
                eta_bins: [0, 1.0, 1.5, 2.0, 2.2, 2.3, 2.4, 2.5]
                y_type: "mean"
                x_bins: [0, 80, 16]
                fitted_func: "y = A1*x + A2"
            IT_EA:
                x_title: "$\\rho$"
                y_title: "$iso_{track}$ [GeV]"
                title: "$EA_{track}$"
                x: "`ScoutingRho.fixedGridRhoFastjetAll`"
                y: "trackIso"
                eta_bins: [0, 1.0, 1.5, 2.0, 2.2, 2.3, 2.4, 2.5]
                y_type: "mean"
                x_bins: [0, 80, 16]
                fitted_func: "y = A1*x + A2"
            IE_scale:
                x_title: "$1/p_T$ [1/GeV]"
                y_title: "$(I_{ECAL}-\\rho EA_{ECAL})/p_T$"
                title: "$IE_scale$"
                x: "1./pt"
                y: "(ecalIso-`ScoutingRho.fixedGridRhoFastjetAll`*IE_EA)/pt"
                eta_bins: [0, 1.5, 2.5]
                y_type: "mean"
                x_bins: [0.0001, 0.0002, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.04, 0.06, 0.1]
                fitted_func: "y = A1*x + A2"
            IH_scale:
                x_title: "$1/p_T$ [1/GeV]"
                y_title: "$(I_{HCAL}-\\rho EA_{HCAL})/p_T$"
                title: "$IH_scale$"
                x: "1./pt"
                y: "(hcalIso-`ScoutingRho.fixedGridRhoFastjetAll`*IH_EA)/pt"
                eta_bins: [0, 1.5, 2.5]
                y_type: "mean"
                x_bins: [0.0001, 0.0002, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.04, 0.06, 0.1]
                fitted_func: "y = A1*x + A2"
            IT_scale:
                x_title: "$1/p_T$ [1/GeV]"
                y_title: "$(I_{track}-\\rho EA_{track})/p_T$"
                title: "$IT_scale$"
                x: "1./pt"
                y: "(trackIso-`ScoutingRho.fixedGridRhoFastjetAll`*IT_EA)/pt"
                eta_bins: [0, 1.5, 2.5]
                y_type: "mean"
                x_bins: [0.0001, 0.0002, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.04, 0.06, 0.1]
                fitted_func: "y = A1*x + A2"
