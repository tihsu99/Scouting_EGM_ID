# Run with: python3 analysis.py --config-path config/calibration.yaml --local-scheduler
inputdir: /eos/user/t/tihsu/dataset/scouting_id/id_parquet_v1_merged
process:
    signal:
        samples:
            DYToLL_M50: 1.0

n_files: -1
n_workers: 1
# Read the first N candidates per sample, before cuts/splitting; null or -1 reads all.
max_rows_per_sample: 20000000
batch_size: 100000
random_seed: 42
train_ratio: 0.8
# Candidate-level split by original input row; reuse the same files and columns in preparation.
split_columns: [sample, sample_row]
# Preserve the original single-DY, unit-candidate-weight calibration.
normalization: {}

plot_style:
    rc_params:
        figure.figsize: [10, 8]
        font.size: 22
        legend.fontsize: 12
        savefig.dpi: 150
    legend:
        loc: upper left
        frameon: false
        borderaxespad: 1.5
    cms_label:
        label: Preliminary
        data: false
        com: 13.6
        loc: 0
        fontsize: 20

workflow:
    DeriveEffectiveArea:
        skip: false
        isolation_denominator: pt
        plotdir: /eos/user/t/tihsu/dataset/scouting_id/calibration_pt/EffectiveArea
        requirement: "((status == 1)) & (pt > 10) & ((abs(eta) < 1.4442) | ((abs(eta) > 1.566) & (abs(eta) < 2.5))) & (hOverE > 0)"
        # Fit only the training partition defined by split_columns.
        calibration_train_only: true
        calibration_weight_mode: nonnegative
        # sample_row is generated by the loader before cuts; no event IDs are needed.
        input_columns:
            - pt
            - eta
            - status
            - hOverE
            - ecalIso
            - hcalIso
            - trackIso
            - ScoutingRho.fixedGridRhoFastjetAll
        EffectiveArea:
            # H/E retains E = pt*cosh(eta) in both calibration steps.
            c_rho:
                x_title: "$\\rho$"
                y_title: "$E_{HCAL}$"
                title: "$c_{\\rho}$"
                x: "`ScoutingRho.fixedGridRhoFastjetAll`"
                y: "pt*cosh(eta)*hOverE"
                eta_bins: [0, 1.0, 1.5, 1.8, 2.0, 2.2, 2.3, 2.4, 2.5]
                y_type: "contour90"
                x_bins: [10, 50, 20]
                fitted_func: "y = A1*x + A2"
            c_E:
                x_title: "$E_{SC}$ [GeV]"
                y_title: "$H/E-C_{\\rho}\\rho/E$"
                title: "$c_E$"
                x: "(pt*cosh(eta))"
                y: "hOverE-(c_rho*`ScoutingRho.fixedGridRhoFastjetAll`/(pt*cosh(eta)))"
                eta_bins: [0, 1.0, 1.5, 1.8, 2.0, 2.2, 2.3, 2.4, 2.5]
                y_type: "contour90"
                x_bins: [10, 500, 50]
                # One entry per eta interval; null inherits x_bins.
                # Replace null with [min, max, n_bins] or explicit edges (4+ values).
                x_bins_by_eta:
                    - [ 30, 500, 50 ]  # 0.0 <= |eta| < 1.0
                    - [ 50, 500, 50 ]  # 1.0 <= |eta| < 1.5
                    - [ 100, 500, 50 ]  # 1.5 <= |eta| < 1.8
                    - [ 100, 500, 50 ]  # 1.8 <= |eta| < 2.0
                    - [ 150, 500, 50 ]  # 2.0 <= |eta| < 2.2
                    - [150, 500, 50]  # 2.2 <= |eta| < 2.3
                    - [150, 500, 50]  # 2.3 <= |eta| < 2.4
                    - [150, 500, 50]  # 2.4 <= |eta| < 2.5
                fitted_func: "y = A1/x + A2"
            IE_EA:
                x_title: "$\\rho$"
                y_title: "$iso_{ECAL}$ [GeV]"
                title: "$EA_{ECAL}$"
                x: "`ScoutingRho.fixedGridRhoFastjetAll`"
                y: "ecalIso"
                eta_bins: [0, 1.0, 1.5, 2.0, 2.2, 2.3, 2.4, 2.5]
                y_type: "mean"
                x_bins: [10, 50, 40]
                fitted_func: "y = A1*x + A2"
            IH_EA:
                x_title: "$\\rho$"
                y_title: "$iso_{HCAL}$ [GeV]"
                title: "$EA_{HCAL}$"
                x: "`ScoutingRho.fixedGridRhoFastjetAll`"
                y: "hcalIso"
                eta_bins: [0, 1.0, 1.5, 2.0, 2.2, 2.3, 2.4, 2.5]
                y_type: "mean"
                x_bins: [10, 50, 40]
                fitted_func: "y = A1*x + A2"
            IT_EA:
                x_title: "$\\rho$"
                y_title: "$iso_{track}$ [GeV]"
                title: "$EA_{track}$"
                x: "`ScoutingRho.fixedGridRhoFastjetAll`"
                y: "trackIso"
                eta_bins: [0, 1.0, 1.5, 2.0, 2.2, 2.3, 2.4, 2.5]
                y_type: "mean"
                x_bins: [10, 50, 40]
                fitted_func: "y = A1*x + A2"
            IE_scale:
                x_title: "$1/p_T$ [1/GeV]"
                y_title: "$(I_{ECAL}-\\rho EA_{ECAL})/p_T$"
                title: "$IE_scale$"
                x: "1./pt"
                y: "(ecalIso-`ScoutingRho.fixedGridRhoFastjetAll`*IE_EA)/pt"
                eta_bins: [0, 1.5, 2.5]
                y_type: "contour90"
                x_bins: [0.01, 0.1, 18]
                fitted_func: "y = A1*x + A2"
            IH_scale:
                x_title: "$p_T$ [GeV]"
                y_title: "$(I_{HCAL}-\\rho EA_{HCAL})/p_T$"
                title: "$IH_scale$"
                x: "1./pt"
                y: "(hcalIso-`ScoutingRho.fixedGridRhoFastjetAll`*IH_EA)/pt"
                eta_bins: [0, 1.5, 2.5]
                y_type: "contour90"
                x_bins: [0.01, 0.1, 18]
                fitted_func: "y = A1*x + A2"
            IT_scale:
                x_title: "$p_T$ [GeV]"
                y_title: "$(I_{track}-\\rho EA_{track})/p_T$"
                title: "$IT_scale$"
                x: "1./pt"
                y: "(trackIso-`ScoutingRho.fixedGridRhoFastjetAll`*IT_EA)/pt"
                eta_bins: [0, 1.5, 2.5]
                y_type: "contour90"
                x_bins: [0.01, 0.1, 18]
                fitted_func: "y = A1*x + A2"
